# Render Blueprint Configuration for SyncSpace MERN Stack Deployment
# Official documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: syncspace
    env: node
    plan: free
    region: singapore
    buildCommand: npm run build:all
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: mongodb+srv://lbrce_mern_hackthon:lbrce_mern_hackthon@cluster0.pripelu.mongodb.net/alexro?appName=Cluster0
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
